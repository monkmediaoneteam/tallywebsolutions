<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 500" width="100%" height="100%">
  <defs>
    <linearGradient id="saleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#311042" />
      <stop offset="40%" stop-color="#1e1136" />
      <stop offset="100%" stop-color="#0f091f" />
    </linearGradient>
    <linearGradient id="accentFlame" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="flameGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1920" height="500" fill="url(#saleGrad)" />

  <!-- Ambient Light -->
  <circle cx="960" cy="250" r="350" fill="#ef4444" opacity="0.18" filter="url(#flameGlow)" />
  <circle cx="1700" cy="200" r="250" fill="#f59e0b" opacity="0.2" filter="url(#flameGlow)" />
  <circle cx="200" cy="300" r="220" fill="#ec4899" opacity="0.15" filter="url(#flameGlow)" />

  <!-- Layout Container -->
  <g transform="translate(140, 75)">
    <!-- Sale Badge Tag -->
    <rect x="0" y="0" width="220" height="38" rx="19" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b" stroke-width="1.5" />
    <text x="110" y="24" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="14" font-weight="800" letter-spacing="2" text-anchor="middle">🔥 LIMITED PERIOD SALE</text>

    <!-- Headline -->
    <text x="0" y="115" fill="#ffffff" font-family="system-ui, sans-serif" font-size="68" font-weight="900" letter-spacing="-2">
      UP TO <tspan fill="url(#accentFlame)">35% OFF</tspan> ON TOP
    </text>
    <text x="0" y="190" fill="#ffffff" font-family="system-ui, sans-serif" font-size="68" font-weight="900" letter-spacing="-2">
      TALLYPRIME ADD-ONS
    </text>

    <!-- Subtext -->
    <text x="0" y="245" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="20" font-weight="400">
      Supercharge your accounts with verified TDL code, automated billing &amp; instant lifetime licenses.
    </text>

    <!-- Coupon Badge & CTA Row -->
    <g transform="translate(0, 285)">
      <!-- Coupon Code Box -->
      <rect x="0" y="0" width="260" height="56" rx="14" fill="#181824" stroke="rgba(255, 255, 255, 0.2)" stroke-dasharray="6,4" stroke-width="2" />
      <text x="24" y="34" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">CODE:</text>
      <text x="75" y="36" fill="#fbbf24" font-family="system-ui, monospace" font-size="22" font-weight="800" letter-spacing="2">TALLY35</text>
      <rect x="180" y="12" width="65" height="32" rx="8" fill="rgba(251, 191, 36, 0.2)" />
      <text x="212" y="32" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">APPLY</text>

      <!-- CTA Button -->
      <g transform="translate(285, 0)">
        <rect x="0" y="0" width="220" height="56" rx="28" fill="url(#accentFlame)" />
        <text x="110" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="17" font-weight="800" text-anchor="middle">Shop Offers  →</text>
      </g>
    </g>
  </g>

  <!-- Right Side Visual / Discount Circle Graphic -->
  <g transform="translate(1420, 75)">
    <circle cx="175" cy="175" r="160" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="2" />
    <circle cx="175" cy="175" r="135" fill="rgba(239, 68, 68, 0.15)" stroke="#ef4444" stroke-width="2" stroke-dasharray="8,4" />
    
    <text x="175" y="140" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="24" font-weight="800" text-anchor="middle">SAVE EXTRA</text>
    <text x="175" y="210" fill="#ffffff" font-family="system-ui, sans-serif" font-size="76" font-weight="900" text-anchor="middle" letter-spacing="-3">35%</text>
    <text x="175" y="245" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">ON ORDERS OVER ₹1,499</text>

    <!-- Mini badges underneath -->
    <g transform="translate(5, 360)">
      <rect x="0" y="0" width="340" height="34" rx="17" fill="rgba(255,255,255,0.08)" />
      <text x="170" y="22" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="middle">⚡ Instant Delivery via Email &amp; Account</text>
    </g>
  </g>
</svg>
