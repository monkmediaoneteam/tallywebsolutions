<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" width="100%" height="100%">
  <defs>
    <linearGradient id="waGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#021c17" />
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glowWa" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1920" height="600" fill="url(#waGrad)" />

  <!-- Ambient Glow -->
  <circle cx="1600" cy="280" r="300" fill="#059669" opacity="0.25" filter="url(#glowWa)" />
  <circle cx="200" cy="400" r="250" fill="#10b981" opacity="0.15" filter="url(#glowWa)" />

  <!-- Left Content -->
  <g transform="translate(120, 110)">
    <rect x="0" y="0" width="260" height="36" rx="18" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1.5" />
    <circle cx="20" cy="18" r="5" fill="#34d399" />
    <text x="36" y="24" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">OFFICIAL API INTEGRATION</text>

    <text x="0" y="110" fill="#ffffff" font-family="system-ui, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">
      Auto WhatsApp Invoices &amp;
    </text>
    <text x="0" y="180" fill="url(#emeraldGlow)" font-family="system-ui, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">
      Payment Reminders in Tally
    </text>

    <text x="0" y="235" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="20" font-weight="400">
      Send PDF invoices, ledger accounts &amp; automated payment reminders directly from TallyPrime.
    </text>

    <g transform="translate(0, 275)">
      <g transform="translate(0, 0)">
        <circle cx="10" cy="10" r="10" fill="#10b981" opacity="0.3" />
        <path d="M6 10 L9 13 L15 7" stroke="#34d399" stroke-width="2" fill="none" stroke-linecap="round" />
        <text x="30" y="15" fill="#d1fae5" font-family="system-ui, sans-serif" font-size="14" font-weight="500">Auto PDF Attachment</text>
      </g>
      <g transform="translate(230, 0)">
        <circle cx="10" cy="10" r="10" fill="#10b981" opacity="0.3" />
        <path d="M6 10 L9 13 L15 7" stroke="#34d399" stroke-width="2" fill="none" stroke-linecap="round" />
        <text x="30" y="15" fill="#d1fae5" font-family="system-ui, sans-serif" font-size="14" font-weight="500">1-Click UPI Payment Link</text>
      </g>
      <g transform="translate(470, 0)">
        <circle cx="10" cy="10" r="10" fill="#10b981" opacity="0.3" />
        <path d="M6 10 L9 13 L15 7" stroke="#34d399" stroke-width="2" fill="none" stroke-linecap="round" />
        <text x="30" y="15" fill="#d1fae5" font-family="system-ui, sans-serif" font-size="14" font-weight="500">Green Tick Supported</text>
      </g>
    </g>

    <g transform="translate(0, 330)">
      <rect x="0" y="0" width="240" height="54" rx="27" fill="url(#emeraldGlow)" />
      <text x="120" y="34" fill="#064e3b" font-family="system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="middle">Get WhatsApp Add-on  →</text>
    </g>
  </g>

  <!-- Right Chat Preview -->
  <g transform="translate(1260, 90)">
    <rect x="0" y="0" width="520" height="420" rx="24" fill="#111827" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
    
    <!-- WhatsApp Header -->
    <rect x="0" y="0" width="520" height="64" rx="24" fill="#075e54" />
    <circle cx="40" cy="32" r="18" fill="#128c7e" />
    <text x="40" y="38" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">T</text>
    <text x="75" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Tally Automated Dispatch</text>
    <text x="75" y="48" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="12">verified business account</text>

    <!-- Message Bubble -->
    <g transform="translate(30, 90)">
      <rect x="0" y="0" width="460" height="200" rx="16" fill="#005c4b" />
      <text x="20" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Dear Customer,</text>
      <text x="20" y="55" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14">Thank you for your business! Your Tax Invoice #INV-8492 is attached below.</text>
      
      <!-- Attachment card -->
      <g transform="translate(20, 75)">
        <rect x="0" y="0" width="420" height="60" rx="10" fill="#022c22" />
        <rect x="15" y="12" width="36" height="36" rx="6" fill="#ef4444" />
        <text x="33" y="36" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">PDF</text>
        <text x="65" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Tax_Invoice_8492.pdf</text>
        <text x="65" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">240 KB • Digitally Signed</text>
      </g>

      <text x="20" y="165" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Total Due: ₹45,800  |  Due Date: 25 Nov</text>
      <text x="410" y="188" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">11:42 AM ✓✓</text>
    </g>

    <!-- Quick Action Button in chat -->
    <g transform="translate(30, 310)">
      <rect x="0" y="0" width="460" height="44" rx="12" fill="#25d366" />
      <text x="230" y="28" fill="#064e3b" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">💳 Pay Now via UPI / Netbanking</text>
    </g>

    <g transform="translate(30, 365)">
      <rect x="0" y="0" width="460" height="40" rx="12" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" />
      <text x="230" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">📄 View Statement of Account</text>
    </g>
  </g>
</svg>
