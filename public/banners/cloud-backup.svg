<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#111c44" />
      <stop offset="100%" stop-color="#070b18" />
    </linearGradient>
    <linearGradient id="violetGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="vGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1920" height="500" fill="url(#cloudGrad)" />
  <circle cx="1500" cy="250" r="300" fill="#6366f1" opacity="0.22" filter="url(#vGlow)" />
  <circle cx="300" cy="200" r="220" fill="#8b5cf6" opacity="0.15" filter="url(#vGlow)" />

  <g transform="translate(140, 80)">
    <rect x="0" y="0" width="220" height="38" rx="19" fill="rgba(139, 92, 246, 0.2)" stroke="#8b5cf6" stroke-width="1.5" />
    <text x="110" y="24" fill="#c4b5fd" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" text-anchor="middle">ENTERPRISE SOLUTION</text>

    <text x="0" y="120" fill="#ffffff" font-family="system-ui, sans-serif" font-size="64" font-weight="900" letter-spacing="-1.5">
      Tally on Cloud &amp;
    </text>
    <text x="0" y="190" fill="url(#violetGlow)" font-family="system-ui, sans-serif" font-size="64" font-weight="900" letter-spacing="-1.5">
      Multi-Branch Auto Sync
    </text>

    <text x="0" y="245" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="20" font-weight="400">
      Access your TallyPrime from anywhere, on any device (Mac, Windows, iPad, Mobile) with 99.9% uptime.
    </text>

    <g transform="translate(0, 285)">
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="240" height="54" rx="27" fill="url(#violetGlow)" />
        <text x="120" y="34" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="middle">View Cloud Plans  →</text>
      </g>
      <g transform="translate(260, 0)">
        <rect x="0" y="0" width="200" height="54" rx="27" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
        <text x="100" y="34" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Free 7-Day Demo</text>
      </g>
    </g>
  </g>

  <!-- Right Side Visual / Tech Nodes -->
  <g transform="translate(1320, 80)">
    <rect x="0" y="0" width="480" height="340" rx="24" fill="#131c38" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
    
    <g transform="translate(40, 40)">
      <circle cx="40" cy="40" r="28" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" />
      <text x="40" y="47" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle">☁️</text>
      <text x="90" y="34" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Central Cloud Server</text>
      <text x="90" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">High-speed SSD, Tier-4 Data Centre</text>
    </g>

    <line x1="80" y1="120" x2="80" y2="150" stroke="#6366f1" stroke-width="2" stroke-dasharray="4,4" />

    <g transform="translate(40, 150)">
      <circle cx="40" cy="40" r="28" fill="#1e293b" stroke="#10b981" stroke-width="2" />
      <text x="40" y="47" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle">🔒</text>
      <text x="90" y="34" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Automatic Daily Backup</text>
      <text x="90" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Ransomware protection &amp; instant restore</text>
    </g>

    <line x1="80" y1="230" x2="80" y2="260" stroke="#6366f1" stroke-width="2" stroke-dasharray="4,4" />

    <g transform="translate(40, 260)">
      <circle cx="40" cy="40" r="28" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
      <text x="40" y="47" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle">⚡</text>
      <text x="90" y="34" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Multi-Device Access</text>
      <text x="90" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Windows, Mac, Android, iOS browsers</text>
    </g>
  </g>
</svg>
