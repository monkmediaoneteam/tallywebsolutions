<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1920" height="600" fill="url(#bgGrad)" />
  <rect width="1920" height="600" fill="url(#grid)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="1500" cy="250" r="280" fill="#2563eb" opacity="0.3" filter="url(#glow)" />
  <circle cx="1700" cy="400" r="200" fill="#06b6d4" opacity="0.25" filter="url(#glow)" />
  <circle cx="300" cy="150" r="200" fill="#4f46e5" opacity="0.2" filter="url(#glow)" />

  <!-- Left Content Area -->
  <g transform="translate(120, 110)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="230" height="36" rx="18" fill="rgba(6, 182, 212, 0.15)" stroke="#06b6d4" stroke-width="1.5" />
    <circle cx="20" cy="18" r="5" fill="#06b6d4" />
    <text x="36" y="24" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">GST 2.0 COMPLIANT</text>

    <!-- Main Headline -->
    <text x="0" y="110" fill="#ffffff" font-family="system-ui, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">
      Instant E-Invoice &amp;
    </text>
    <text x="0" y="180" fill="url(#cyanGlow)" font-family="system-ui, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">
      Auto GST Reconciliation
    </text>

    <!-- Subtitle -->
    <text x="0" y="235" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="20" font-weight="400" letter-spacing="-0.2">
      1-Click IRN generation, GSTR-2B matching &amp; auto purchase voucher entry for TallyPrime.
    </text>

    <!-- Trust Badges -->
    <g transform="translate(0, 275)">
      <g transform="translate(0, 0)">
        <circle cx="10" cy="10" r="10" fill="#10b981" opacity="0.2" />
        <path d="M6 10 L9 13 L15 7" stroke="#10b981" stroke-width="2" fill="none" stroke-linecap="round" />
        <text x="30" y="15" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" font-weight="500">Government Portal Connected</text>
      </g>
      <g transform="translate(260, 0)">
        <circle cx="10" cy="10" r="10" fill="#10b981" opacity="0.2" />
        <path d="M6 10 L9 13 L15 7" stroke="#10b981" stroke-width="2" fill="none" stroke-linecap="round" />
        <text x="30" y="15" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" font-weight="500">Zero Manual Errors</text>
      </g>
      <g transform="translate(460, 0)">
        <circle cx="10" cy="10" r="10" fill="#10b981" opacity="0.2" />
        <path d="M6 10 L9 13 L15 7" stroke="#10b981" stroke-width="2" fill="none" stroke-linecap="round" />
        <text x="30" y="15" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" font-weight="500">Instant TDL License</text>
      </g>
    </g>

    <!-- CTA Button Graphic -->
    <g transform="translate(0, 330)">
      <rect x="0" y="0" width="220" height="54" rx="27" fill="url(#cyanGlow)" />
      <text x="110" y="34" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Explore GST Add-on  →</text>
    </g>
  </g>

  <!-- Right Visual Feature Mockup Card -->
  <g transform="translate(1220, 80)">
    <!-- Card Outer Container -->
    <rect x="0" y="0" width="580" height="440" rx="28" fill="#111827" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
    
    <!-- Top Card Header Bar -->
    <rect x="0" y="0" width="580" height="60" rx="28" fill="#1f2937" />
    <circle cx="35" cy="30" r="6" fill="#ef4444" />
    <circle cx="55" cy="30" r="6" fill="#f59e0b" />
    <circle cx="75" cy="30" r="6" fill="#10b981" />
    <text x="110" y="36" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="600">TallyPrime 4.0+ // GST Suite Live</text>

    <!-- Status Indicator -->
    <rect x="420" y="18" width="130" height="26" rx="13" fill="rgba(16, 185, 129, 0.2)" />
    <circle cx="435" cy="31" r="4" fill="#10b981" />
    <text x="448" y="36" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">100% MATCHED</text>

    <!-- Content Inside Card -->
    <!-- Metric Row 1 -->
    <g transform="translate(40, 90)">
      <rect x="0" y="0" width="235" height="90" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" />
      <text x="20" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">GSTR-2B Invoices</text>
      <text x="20" y="68" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="800">1,482</text>
      <text x="160" y="68" fill="#10b981" font-family="system-ui, sans-serif" font-size="14" font-weight="700">+100%</text>
    </g>

    <!-- Metric Row 2 -->
    <g transform="translate(305, 90)">
      <rect x="0" y="0" width="235" height="90" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" />
      <text x="20" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">ITC Claim Saved</text>
      <text x="20" y="68" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="28" font-weight="800">₹4.82 Lakh</text>
    </g>

    <!-- Data Table Preview -->
    <g transform="translate(40, 210)">
      <rect x="0" y="0" width="500" height="190" rx="16" fill="#0b0f19" stroke="rgba(255,255,255,0.05)" />
      
      <!-- Table Row 1 -->
      <line x1="20" y1="45" x2="480" y2="45" stroke="rgba(255,255,255,0.08)" />
      <text x="25" y="30" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" font-weight="600">INVOICE NO.</text>
      <text x="160" y="30" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" font-weight="600">PARTY NAME</text>
      <text x="330" y="30" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" font-weight="600">GST AMOUNT</text>
      <text x="440" y="30" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" font-weight="600">STATUS</text>

      <!-- Row 2 -->
      <text x="25" y="80" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" font-weight="600">INV-2026-089</text>
      <text x="160" y="80" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Apex Industrial Ltd</text>
      <text x="330" y="80" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">₹34,200</text>
      <rect x="430" y="66" width="50" height="20" rx="6" fill="#065f46" />
      <text x="455" y="80" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">MATCH</text>

      <!-- Row 3 -->
      <line x1="20" y1="100" x2="480" y2="100" stroke="rgba(255,255,255,0.04)" />
      <text x="25" y="130" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" font-weight="600">INV-2026-090</text>
      <text x="160" y="130" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Bharat Logistics Co</text>
      <text x="330" y="130" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">₹89,450</text>
      <rect x="430" y="116" width="50" height="20" rx="6" fill="#065f46" />
      <text x="455" y="130" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">MATCH</text>

      <!-- Row 4 -->
      <line x1="20" y1="150" x2="480" y2="150" stroke="rgba(255,255,255,0.04)" />
      <text x="25" y="175" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" font-weight="600">INV-2026-091</text>
      <text x="160" y="175" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Zenith Steels Corp</text>
      <text x="330" y="175" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">₹1,12,000</text>
      <rect x="430" y="161" width="50" height="20" rx="6" fill="#065f46" />
      <text x="455" y="175" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">MATCH</text>
    </g>
  </g>
</svg>
